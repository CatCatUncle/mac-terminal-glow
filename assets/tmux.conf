# ============================================================
#  tmux 配置 —— 现代化、好看、顺手
# ============================================================

# 真彩色 + 斜体支持
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# 前缀键改成 Ctrl-a（比默认 Ctrl-b 顺手）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 鼠标支持：点选窗格 / 拖拽调整 / 滚轮翻历史
set -g mouse on

# 窗口/窗格序号从 1 开始，关闭后自动重排
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 更大历史缓冲、更快响应
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# —— 快捷键 ——
# r 重载配置
bind r source-file ~/.tmux.conf \; display "✅ tmux 配置已重载"
# | 和 - 直观地横/竖分屏（继承当前路径）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# 新窗口继承当前路径
bind c new-window -c "#{pane_current_path}"
# hjkl 切换窗格
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Shift+方向键 直接切窗口（无需前缀）
bind -n S-Left  previous-window
bind -n S-Right next-window

# ============================================================
#  状态栏外观（Snazzy 配色）
# ============================================================
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#282a36,fg=#eff0eb"

# 左侧：会话名
set -g status-left-length 30
set -g status-left "#[bg=#57c7ff,fg=#282a36,bold] ❐ #S #[bg=#282a36,fg=#57c7ff]"

# 右侧：日期时间
set -g status-right-length 60
set -g status-right "#[fg=#5af78e]#[bg=#5af78e,fg=#282a36,bold] %H:%M #[fg=#ff6ac1]#[bg=#ff6ac1,fg=#282a36,bold] %m-%d "

# 窗口标签
setw -g window-status-format "#[fg=#686868] #I:#W "
setw -g window-status-current-format "#[bg=#ff6ac1,fg=#282a36,bold] #I:#W #[default]"
setw -g window-status-separator ""

# 窗格边框
set -g pane-border-style "fg=#424450"
set -g pane-active-border-style "fg=#57c7ff"

# 消息提示
set -g message-style "bg=#f3f99d,fg=#282a36,bold"
